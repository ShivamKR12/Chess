name: Build and Release Chess Game

on:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install setuptools

      - name: Build application
        run: |
          python setup.py build_apps

      - name: Archive Windows build
        run: |
          cd build/win_amd64
          zip -r ../../Chess-Windows.zip .

      - name: Archive Linux build
        run: |
          cd build/manylinux2014_x86_64
          zip -r ../../Chess-Linux.zip .

      - name: Archive macOS build
        run: |
          cd build/macosx_10_13_x86_64
          zip -r ../../Chess-macOS.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Chess v2.0.${{ github.run_number }}
          files: |
            Chess-Windows.zip
            Chess-Linux.zip
            Chess-macOS.zip

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Publish Windows to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_win
          cp Chess-Windows.zip push_win/
          butler push push_win shivamkr12/chess:windows --userversion v2.0.${{ github.run_number }}

      - name: Publish Linux to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_linux
          cp Chess-Linux.zip push_linux/
          butler push push_linux shivamkr12/chess:linux --userversion v2.0.${{ github.run_number }}

      - name: Publish macOS to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_mac
          cp Chess-macOS.zip push_mac/
          butler push push_mac shivamkr12/chess:mac --userversion v2.0.${{ github.run_number }}
